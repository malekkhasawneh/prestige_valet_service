name: prestige_valet_app
description: A specialized application for providing car parking service.
version: 1.0.0+2

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  #data
  connectivity_plus: ^6.0.5
  internet_connection_checker: ^2.0.0
  dio: ^5.3.2
  flutter_secure_storage: ^9.0.0
  barcode_scan2: ^4.2.4
  #domain
  equatable: ^2.0.5
  dartz: ^0.10.1
  #presentation
  cupertino_icons: ^1.0.2
  qr_flutter: ^4.1.0
  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  encrypt: ^5.0.2
  image_picker: ^1.0.4
  otp_pin_field: ^1.2.2
  lottie: ^3.1.2
  google_sign_in: ^6.2.1
  firebase_core: ^2.23.0
  firebase_auth: ^4.14.1
  flutter_facebook_auth:
  twitter_login: ^4.4.2
  awesome_dialog: ^3.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0
  firebase_messaging: ^14.7.6
  awesome_notifications: ^0.9.3+1
  myfatoorah_flutter: ^3.0.8
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  thermal_printer: ^1.0.5
  dart_ping_ios: ^4.0.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3
  infinite_scroll_pagination: ^4.0.0
  sign_in_with_apple: ^6.1.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - images/
    - images/welcome_logo.png
    - images/default_user_image.jpg
    - images/printer_header_logo.png
    - images/Apple_Logo.png
    - images/Gmail_Logo.png
    - images/Facebook_Logo.png
    - images/Twitter_Logo.png
    - images/qr_code_scanner.json
    - images/no_internet.json
    - images/printer_header_logo.png
    - shorebird.yaml

  fonts:
    - family: SourceSansPro
      fonts:
        - asset: fonts/SourceSansPro-Regular.ttf
        - asset: fonts/SourceSansPro-Italic.ttf
        - asset: fonts/SourceSansPro-Bold.ttf
        - asset: fonts/SourceSansPro-BoldItalic.ttf
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Regular.ttf
        - asset: fonts/Montserrat-Italic.ttf
        - asset: fonts/Montserrat-Bold.ttf
        - asset: fonts/Montserrat-BoldItalic.ttf
